<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補貨清單</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#FAF7F4;min-height:100vh;padding-bottom:40px}
.hdr{background:#fff;border-bottom:1px solid #E8E2DC;padding:12px 20px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.hdr img{height:40px;object-fit:contain}
.hdr-title{font-size:14px;font-weight:600;color:#6B6560;margin-top:4px}
.main{max-width:500px;margin:0 auto;padding:20px 16px}
.add-row{display:flex;gap:8px;margin-bottom:20px}
.add-row input{flex:1;border:1.5px solid #E8E2DC;border-radius:10px;padding:12px 14px;font-size:16px;font-family:'Inter',sans-serif;outline:none;background:#fff}
.add-row input:focus{border-color:#C4726A}
.add-row button{background:#C4726A;color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.items{display:flex;flex-direction:column;gap:6px}
.item{background:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.item.done{opacity:.45}
.item.done .item-name{text-decoration:line-through}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid #E8E2DC;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:#fff;transition:all .15s}
.item.done .cb{background:#3A7D5A;border-color:#3A7D5A;color:#fff}
.item-name{flex:1;font-size:16px}
.del{background:none;border:none;color:#B8B0A8;font-size:20px;cursor:pointer;padding:2px 6px;line-height:1}
.empty{text-align:center;color:#B8B0A8;padding:40px 0;font-size:14px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.count{font-size:13px;color:#6B6560}
.clear-btn{font-size:12px;color:#B8B0A8;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline}
</style>
</head>

}));

const col = collection(db, 'shopping_list');
let items = [];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const pending = items.filter(i=>!i.done);
  const done = items.filter(i=>i.done);
  const all = [...pending, ...done];
  document.getElementById('count').textContent = '待購 '+pending.length+' 項'+(done.length?' · 已買 '+done.length+' 項':'');
  const list = document.getElementById('list');
  if(!all.length){ list.innerHTML='<div class="empty">目前沒有待購物品 🎉</div>'; return; }
  list.innerHTML = '';
  all.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item' + (item.done?' done':'');
    div.innerHTML =
      '<div class="cb">'+(item.done?'✓':'')+'</div>'+
      '<div class="item-name">'+esc(item.name)+'</div>'+
      '<button class="del">×</button>';
    div.querySelector('.cb').addEventListener('click', () => updateDoc(doc(db,'shopping_list',item.id),{done:!item.done}));
    div.querySelector('.del').addEventListener('click', async () => {
      if(confirm('刪除這項？')) await deleteDoc(doc(db,'shopping_list',item.id));
    });
    list.appendChild(div);
  });
}

// Real-time sync
onSnapshot(query(col, orderBy('createdAt','asc')), snap => {
  items = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
});

// Add button
document.getElementById('add-btn').addEventListener('click', add);
document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') add(); });

async function add(){
  const inp = document.getElementById('inp');
  const val = inp.value.trim();
  if(!val){ inp.focus(); return; }
  try {
    await addDoc(col, {name:val, done:false, createdAt:new Date().toISOString()});
    inp.value = '';
    inp.focus();
  } catch(e){ alert('新增失敗：'+e.message); }
}

// Clear done
document.getElementById('clear-btn').addEventListener('click', async () => {
  const done = items.filter(i=>i.done);
  if(!done.length) return;
  if(!confirm('清除 '+done.length+' 項已購買的物品？')) return;
  for(const i of done) await deleteDoc(doc(db,'shopping_list',i.id));
});
</script>
</body>
</html>
