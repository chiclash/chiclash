<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>店務清單</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 顏色、字型比照 chiclash.html 主系統 */
:root{
  --bg:#F4F2EF;--white:#FFF;--border:#E0DBD5;--border2:#C8C2BA;
  --ink:#1C1A17;--sub:#7A746C;--faint:#B0AAA2;
  --ok:#1A7A45;--ok-bg:#EBF5F0;--warn:#B83010;--warn-bg:#FBF0EC;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans TC',system-ui,-apple-system,'PingFang TC',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:1px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* 頂部 */
.hero{display:flex;align-items:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 0 4px;position:relative;flex-wrap:wrap}
.brand{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--sub);width:100%}
.datebtn{display:flex;align-items:baseline;gap:10px;min-height:44px;text-align:left;padding:0 6px;margin-left:-6px;border-radius:8px}
.datebtn:hover{background:var(--white)}
#dateLabel{font-size:26px;font-weight:700;letter-spacing:-.01em}
#dateSub{font-size:14px;color:var(--sub)}
#dateSub::after{content:' ▾';color:var(--faint)}
.hero-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.plain{min-height:38px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--white);font-size:14px;font-weight:500;color:var(--sub);white-space:nowrap}
.plain:hover{border-color:var(--border2);color:var(--ink)}
.who{min-height:38px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--white);font-size:14px;font-weight:600;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.who::before{content:'👤 ';font-weight:400}
.who.empty{background:var(--warn);border-color:var(--warn);color:#fff}
.calpop{position:absolute;top:100%;left:0;width:320px;max-width:calc(100vw - 32px);background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 10px 30px rgba(28,26,23,.14);z-index:12}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-weight:600}
.arrow{width:38px;height:38px;border-radius:8px;color:var(--sub);flex:none;font-size:16px}
.arrow:hover{background:var(--bg);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wd{font-size:12px;color:var(--faint);height:26px;line-height:26px}
.cal button{height:38px;width:38px;margin:auto;border-radius:8px;position:relative;font-variant-numeric:tabular-nums}
.cal button:hover{background:var(--bg)}
.cal button.off{color:#CEC8C0}
.cal button.today,.day.today .n{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.sel,.day.sel .n{background:var(--ink);color:#fff;font-weight:600;box-shadow:none}
.cal button.dot::after,.day.dot .n::after{content:'';position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--warn)}
.cal button.sel.dot::after,.day.sel.dot .n::after{background:#fff}

/* 週列 */
.strip{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 12px}
.weekrow{display:flex;align-items:center;gap:4px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:4px}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-width:0}
.day{display:flex;flex-direction:column;align-items:center;min-height:54px;justify-content:center;border-radius:8px}
.day:hover{background:var(--bg)}
.day .w{font-size:11px;color:var(--sub)}
.day .n{width:32px;height:32px;line-height:32px;border-radius:8px;position:relative;font-weight:500;font-variant-numeric:tabular-nums;text-align:center}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid #F0B8A8;padding:10px 14px;font-size:14px;border-radius:8px;margin-bottom:12px}

/* 手機分頁，同現金櫃的 MV / SR 分頁 */
.tabs{display:none;gap:2px;margin-top:10px;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{min-height:42px;padding:0 20px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tab[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:var(--white)}

/* 兩間店 */
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;align-items:start}
.part{--c:#8A5F1A;--c-bg:#FAF3E5;--c-bd:#E6D3AE;background:var(--white);border:1.5px solid var(--c-bd);border-radius:12px;min-width:0;overflow:hidden}
.part[data-store=mv]{--c:#1656A0;--c-bg:#EBF2FA;--c-bd:#B8D0EF}
.part[data-store=sr]{--c:#5E35B1;--c-bg:#F0EBF9;--c-bd:#C9B8EF}
.part-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--c-bg);border-bottom:1px solid var(--c-bd)}
.part-head h2{font-size:17px;font-weight:700;color:var(--c)}
.part-head small{font-size:12px;font-weight:600;color:var(--c);background:var(--white);border:1px solid var(--c-bd);border-radius:10px;padding:1px 9px}
.part-head small:empty{display:none}
.part-head .x{margin-left:auto}
.sec{padding:16px 18px 4px}
.sec h3{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin-bottom:8px}
.sec h3 .num{background:var(--c);color:#fff;border-radius:50%;width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;letter-spacing:0}
.sec h3 small{margin-left:auto;font-weight:600;font-size:12px;letter-spacing:0;color:var(--sub);font-variant-numeric:tabular-nums}
.panel{background:var(--c-bg);border:1px solid var(--c-bd);border-radius:10px;padding:10px 12px}
.part>.sec:last-child{padding-bottom:18px}

/* 新增列 */
.add{display:flex;gap:6px}
.add .field{flex:1}
.add select{flex:none;width:96px;min-height:40px;border:1px solid var(--border);border-radius:6px;background:var(--white);padding:0 6px;font-size:14px;color:var(--sub);outline:none}
.field{width:100%;min-height:40px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:6px 10px;outline:none;min-width:0}
.field:focus,.add select:focus{border-color:var(--c,var(--ink))}
.field::placeholder{color:var(--faint)}
.plus,.btn{min-height:40px;padding:0 16px;border-radius:6px;background:var(--c,var(--ink));color:#fff;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.plus:hover,.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.btn.line{background:var(--white);border:1px solid var(--border);color:var(--ink);font-weight:500}

/* 清單列 */
.list{margin-top:8px;background:var(--white);border:1px solid var(--c-bd,var(--border));border-radius:8px;padding:0 10px}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row.ro{cursor:default}
.check{width:22px;height:22px;border:1.5px solid var(--border2);border-radius:5px;flex:none;position:relative;background:var(--white)}
.row:not(.ro):hover .check{border-color:var(--c)}
.row.done .check{background:var(--ok);border-color:var(--ok)}
.row.done .check::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.body{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.row.done .t{color:var(--faint);text-decoration:line-through}
.m{font-size:12px;color:var(--sub)}
.m.old{color:var(--warn);font-weight:600}
.x{width:30px;height:30px;flex:none;color:var(--faint);font-size:17px;border-radius:6px}
.x:hover{background:var(--bg);color:var(--warn)}
.none{color:var(--sub);font-size:13px;padding:4px 0}
.link{color:var(--c);font-size:13px;font-weight:600;min-height:36px;margin-top:2px}

/* 點鈔，同現金櫃 */
.when{font-size:13px;color:var(--sub);margin-bottom:8px;font-variant-numeric:tabular-nums}
.when span{font-weight:700;color:var(--c)}
.when small{font-size:12px;margin-left:6px}
.dens{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.den{display:flex;align-items:center;gap:6px;background:var(--white);border-radius:8px;padding:5px 8px;min-width:0}
.den label{font-size:13px;font-weight:600;color:var(--sub);flex:none;min-width:30px}
.den label::after{content:' ×';color:var(--faint);font-weight:400}
.den input{width:100%;min-width:0;min-height:34px;border:1px solid var(--border);border-radius:6px;background:var(--white);text-align:right;padding:0 8px;outline:none;font-weight:600;font-variant-numeric:tabular-nums}
.den input:focus{border-color:var(--c)}
.den input::placeholder{color:#CEC8C0;font-weight:400}
.totalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.total{font-size:15px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.total small{font-size:15px;font-weight:700}
.total small::after{content:'：'}
.c-total{font-size:20px}
.cmp{margin-top:10px;border-radius:8px;padding:8px 12px;background:var(--white);border:1px solid var(--c-bd);font-size:14px;font-variant-numeric:tabular-nums}
.cmp div{display:flex;justify-content:space-between;gap:12px}
.cmp .c-exp{font-weight:700;color:var(--c)}
.cmp .ok{color:var(--ok);font-weight:700}.cmp .bad{color:var(--warn);font-weight:700}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.hint.err{color:var(--warn);font-weight:600}
.counts{margin-top:8px}
.cnt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;font-variant-numeric:tabular-nums}
.cnt:last-child{border-bottom:0}
.cnt b{font-weight:700}
.cnt .res{width:100%;font-size:12px;color:var(--sub)}
.cnt .res.ok{color:var(--ok);font-weight:600}.cnt .res.bad{color:var(--warn);font-weight:600}
.addpart{display:block;margin:16px auto 0;min-height:42px;padding:0 20px;border:1.5px dashed var(--border2);border-radius:10px;color:var(--sub);font-size:14px;font-weight:500}
.addpart:hover{border-color:var(--sub);color:var(--ink)}

/* 對話框 */
dialog{border:0;border-radius:12px;padding:20px;width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink);background:var(--white);margin:auto}
dialog::backdrop{background:rgba(28,26,23,.45)}
dialog h2{font-size:17px;font-weight:700;margin-bottom:12px}
.addrow{display:flex;gap:8px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px;max-height:50vh;overflow:auto}
.names button{min-height:46px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-weight:600;overflow-wrap:anywhere}
.names button:hover{border-color:var(--border2);background:var(--bg)}
.names button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tplrow{display:flex;align-items:center;gap:2px;padding:4px 0}
.tplrow .mv{width:34px;height:40px;color:var(--sub);flex:none}
.tplrow .mv:disabled{opacity:.25}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;z-index:20;max-width:90vw}

@media (max-width:860px){
  .wrap{padding:0 12px}
  .tabs{display:flex}
  .parts{display:block}
  .part:not(.cur){display:none}
  #dateLabel{font-size:22px}
  .hero{padding-top:calc(12px + env(safe-area-inset-top))}
  .sec{padding:14px 12px 2px}
  .part-head{padding:10px 12px}
  .arrow{width:30px}
  .plain{padding:0 10px}
  .who{max-width:110px;padding:0 10px}
  .add select{width:78px}
  .den{padding:4px 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">CHIC LASH · 店務清單</div>
    <button class="datebtn" id="dateBtn" aria-expanded="false" aria-label="選擇日期"><span id="dateLabel"></span><span id="dateSub"></span></button>
    <div class="hero-r">
      <button class="plain" id="goToday">今天</button>
      <button class="who empty" id="who">選名字</button>
    </div>
    <div class="calpop" id="calpop" hidden>
      <div class="cal-head">
        <button class="arrow" id="calPrev" aria-label="上個月">←</button>
        <b id="calTitle"></b>
        <button class="arrow" id="calNext" aria-label="下個月">→</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
  </header>
  <div class="strip">
    <div class="weekrow">
      <button class="arrow" id="dayPrev" aria-label="前一週">←</button>
      <div class="week" id="week"></div>
      <button class="arrow" id="dayNext" aria-label="下一週">→</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
  <div class="banner" id="banner" role="alert" hidden></div>
  <main class="parts" id="parts"></main>
  <button class="addpart" id="addStore">＋ 新增店</button>
</div>

<dialog id="nameDlg" aria-labelledby="nameTitle">
  <h2 id="nameTitle">你是誰？ Who's working?</h2>
  <div class="names" id="names"></div>
  <div class="addrow">
    <input class="field" id="otherName" placeholder="其他名字 Other name" maxlength="30" autocomplete="off" aria-label="其他名字">
    <button class="btn line" id="otherUse">使用</button>
  </div>
  <div class="foot"><button class="btn line" id="nameCancel">取消</button></div>
</dialog>
<dialog id="tplDlg" aria-labelledby="tplTitle">
  <h2 id="tplTitle"></h2>
  <div id="tplList"></div>
  <button class="btn line" id="tplCopy" style="width:100%" hidden></button>
  <div class="foot"><button class="btn" id="tplClose">完成</button></div>
</dialog>
<dialog id="storeDlg" aria-labelledby="storeTitle">
  <h2 id="storeTitle">新增店 Add store</h2>
  <input class="field" id="storeName" maxlength="40" autocomplete="off" placeholder="店名 Store name" aria-label="店名">
  <div class="hint">新的店有自己的清單和點鈔紀錄，但不會連到主系統的現金櫃。</div>
  <div class="foot">
    <button class="btn line" id="storeCancel">取消</button>
    <button class="btn" id="storeOk">新增</button>
  </div>
</dialog>
<dialog id="confirmDlg">
  <h2 id="confirmText"></h2>
  <div class="foot">
    <button class="btn line" id="confirmNo">取消</button>
    <button class="btn" id="confirmYes">確定</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
const FB = 'https://www.gstatic.com/firebasejs/10.12.0/';
const LINKED = {mv:'Mill Valley',sr:'San Rafael'}; // 這兩間連到主系統現金櫃
const CD_DENOMS = [1,5,10,20,50,100];              // 和主系統現金櫃相同的面額
const WEEK = ['日','一','二','三','四','五','六'];
const $ = id => document.getElementById(id);

// Firebase 在畫面出來之後才載入：就算連不上，畫面也不會空白，還能顯示原因
let app, db, fs = null;

/* ---------- helpers ---------- */
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseDay(s); d.setDate(d.getDate()+n); return ymd(d); };
const shortDay = s => { const d = parseDay(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const dayLabel = s => { const d = parseDay(s); return `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`; };
const clock = iso => iso ? new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
const hhmmLabel = t => { if (!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${pad(m)} ${ap}`; };
const nowHHMM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const setText = (el,t) => { if (el.textContent !== t) el.textContent = t; };
const setVal = (el,v) => { if (document.activeElement !== el && el.value !== v) el.value = v; };
const enterKey = (input,fn) => input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); fn(); }
});
// 只更新有變動的那一列，不重畫整個清單，畫面才不會亂跳
function syncList(parent, rows, keyOf, make, update) {
  const old = new Map([...parent.children].map(el => [el.dataset.key, el]));
  let cursor = parent.firstElementChild;
  for (const row of rows) {
    const key = keyOf(row);
    let el = old.get(key);
    if (!el) { el = make(row); el.dataset.key = key; }
    old.delete(key);
    update(el,row);
    if (el === cursor) cursor = cursor.nextElementSibling;
    else parent.insertBefore(el,cursor);
  }
  old.forEach(el => el.remove());
}

/* ---------- state ---------- */
let today = ymd(new Date());
let viewDate = today;
let calMonth = today.slice(0,7);
let curStore = LS.get('sl.cur') || 'mv';
let staff = [];
let name = (() => { const s = LS.get('sl.name'); return s && s.date === today ? s.name : ''; })();
let dbError = '';
let storeCfg = {};
let connected = false;
const data = {};
let _D = null;      // 主系統資料（每日記帳只讀目前看的月份）
let mainFailed = '';
let mainIdx = {};
const shardHash = {};

function stores() {
  const custom = Object.entries(storeCfg).filter(([,v]) => !v.hidden && v.name)
    .sort((a,b) => (a[1].order||0)-(b[1].order||0)).map(([id,v]) => ({id,name:v.name}));
  return [...Object.entries(LINKED).map(([id,n]) => ({id,name:n})),...custom];
}
const storeName = id => (stores().find(s => s.id === id) || {}).name || id;
const isLinked = id => id in LINKED;
const refOf = {
  board: s => fs.doc(db,'storeList',`store_${s}_board`),
  cash: s => fs.doc(db,'storeList',`store_${s}_cash`),
  checks: (s,d) => fs.doc(db,'storeList',`store_${s}_checks_${d}`),
  cfg: () => fs.doc(db,'storeList','store_config'),
  main: () => fs.doc(db,'chic lash','data')
};
function showDbError(e) {
  console.error(e);
  dbError = e && e.code === 'permission-denied'
    ? '資料庫拒絕存取，需要在 Firebase 規則開放 storeList。'
    : '連不上資料庫，請檢查 WiFi 後重新整理。';
  renderBanner();
}
const write = p => p.catch(e => { showDbError(e); throw e; });
function renderBanner() {
  const msg = dbError || (navigator.onLine === false ? '目前離線，連上網路後才會同步。' : '');
  setText($('banner'),msg);
  $('banner').hidden = !msg;
}
addEventListener('online', () => { dbError = fs ? '' : dbError; renderBanner(); });
addEventListener('offline', renderBanner);
function needDb() {
  if (fs) return true;
  toast('還沒連上資料庫，這筆沒有存');
  return false;
}

/* ---------- 主系統現金櫃算法：以下函式直接取自 chiclash.html，確保數字和現金櫃頁一致 ---------- */
const gv = v => v!==''&&v!==undefined&&v!==null?parseFloat(v)||0:0;
function r2(n){return Math.round((n||0)*100)/100;}
const fmtDate = ymd;
function cdData(){return (_D&&_D.cd)||[];}
function defaultTipNames(){return [];} // 小費不進帳面應有，這裡不需要名單
window._gcFbAll = [];
function applyGcPayOverrides(){
  var ov=(_D&&_D.gcPayOverride)||{};
  (window._gcFbAll||[]).forEach(function(g){
    if(g._origPay===undefined)g._origPay=g.payMethod||'';
    g.payMethod=(g.code&&ov[g.code])?ov[g.code]:g._origPay;
  });
}
function cdAddDays(dateStr,n){var d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return fmtDate(d);}
function cdDupInIds(store){
  // 櫃台把「客人付的現金」手動記成「放入」：這些錢每日記帳已經算了，不能再加一次。
  // 判斷：①同一天、金額跟某位客人付的現金一樣，或 ②備註裡有那天客人的名字／技師名字 → 視為營業現金（不加）
  // 其他的放入（例如老闆補零錢、放備用金）才會加進帳面。
  var ids={}, byDate={}, info={};
  var staffAll=(_D.staff||[]).map(function(n){return String(n).toLowerCase();});
  cdData().forEach(function(e){ if(e.store===store&&e.type==='in')(byDate[e.date]=byDate[e.date]||[]).push(e); });
  Object.keys(byDate).forEach(function(date){
    var mo=date.slice(0,7), d=String(parseInt(date.slice(8,10),10));
    var cands=[], names=[];
    ['mv','sr'].forEach(function(st){
      var day=_D[st]&&_D[st][mo]&&_D[st][mo][d];
      (day&&Array.isArray(day.clients)?day.clients:[]).forEach(function(c){
        if(c.clientName)names.push({n:String(c.clientName).toLowerCase().split('(')[0].trim(),c:c});
        if(st!==store)return;
        var cash=0;
        if(c.pay==='gc'){ if(c.topupPay==='cash')cash+=gv(c.topup); }
        else if(c.cp){ if(c.cpTopupPay==='cash')cash+=gv(c.cpTopup); }
        else if(c.pay==='cash')cash+=gv(c.svc);
        if(cash>0)cands.push({amt:r2(cash),used:false});
      });
    });
    ((_D.products&&_D.products[mo])||[]).forEach(function(p){ var b=p.store?(p.store===store):(store==='mv'); if(b&&p.date===date&&p.pay==='cash'&&gv(p.amt)>0)cands.push({amt:r2(gv(p.amt)),used:false}); });
    (_D.gc_cards||[]).forEach(function(g){ if(g.store===store&&g.date===date&&g.pay==='cash')cands.push({amt:r2(g.amt||0),used:false}); });
    (window._gcFbAll||[]).forEach(function(g){ if(g.store===store&&g.date===date&&g.payMethod==='cash')cands.push({amt:r2((g.amount||0)+gv(g.tip)),used:false}); });
    byDate[date].forEach(function(e){
      var c=cands.find(function(x){return !x.used&&Math.abs(x.amt-e.amt)<0.005;});
      if(c){c.used=true;ids[e.id]=true;info[e.id]='match';return;}
      var note=String(e.note||'').toLowerCase();
      var hitClient=names.find(function(x){return x.n&&x.n.length>=3&&note.indexOf(x.n)>=0;});
      var hitStaff=staffAll.some(function(n){return n&&note.indexOf(n)>=0;});
      if(hitClient||hitStaff){
        ids[e.id]=true;
        var cl=hitClient&&hitClient.c;
        info[e.id]=cl?(cl.pay==='cash'?'記帳現金是 $'+gv(cl.svc).toFixed(2)+'，金額不同':(cl.pay==='gc'?'記帳是禮品卡':(cl.cp?'記帳是 ClassPass':'記帳是'+(cl.pay==='venmo'?' Venmo':'刷卡')))):'記帳找不到這筆現金';
      }
    });
  });
  return {ids:ids,info:info};
}
function cdHHMM(t){ // '3:12 PM' / '15:12' / '15:12:00' → '15:12'
  var m=String(t||'').match(/(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/); if(!m)return '';
  var h=parseInt(m[1],10); if(m[3]){ if(/p/i.test(m[3])&&h<12)h+=12; if(/a/i.test(m[3])&&h===12)h=0; }
  return String(h).padStart(2,'0')+':'+m[2];
}
function cdEntryTime(e){ // 用紀錄建立的時間當成發生時間（當天輸入的才準）；不知道就回傳空
  if(e&&e.time&&/^\d{2}:\d{2}$/.test(e.time))return e.time; // 手動填的時間最優先
  var id=e.id||e.at||0; if(!(id>1e12&&id<9e14))return '';
  var d=new Date(id); if(fmtDate(d)!==e.date)return '';
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function cdSalesItems(store,date){ // 這天每一筆進保險箱的現金（含時間）
  var mo=date.slice(0,7), d=String(parseInt(date.slice(8,10),10)), out=[];
  var day=_D[store]&&_D[store][mo]&&_D[store][mo][d];
  var clients=(day&&Array.isArray(day.clients))?day.clients:[];
  var st=(_D.tipSplitState&&_D.tipSplitState[mo]&&_D.tipSplitState[mo][d])||{};
  clients.forEach(function(c,ci){
    // 要平分的現金小費（同一筆分給 2 人以上）：先放保險箱，月底再發 → 算進保險箱，但不是營業額；自己拿的現金小費不算
    var tip=gv(c.tip);
    if(tip>0&&(c.tipPay||'card')==='cash'){
      var nm=st[store+'_'+ci]; if(!nm||!nm.length)nm=defaultTipNames(c,date);
      nm=nm.filter(function(n,i){return nm.indexOf(n)===i;});
      if(nm.length>1)out.push({t:cdHHMM(c.time)||'00:00',amt:r2(tip),tip:true,label:(c.clientName||'')+'（'+nm.join('、')+' 平分）'});
    }
    var cash=0;
    if(c.pay==='gc'){ if(c.topupPay==='cash')cash+=gv(c.topup); }
    else if(c.cp){ if(c.cpTopupPay==='cash')cash+=gv(c.cpTopup); }
    else if(c.pay==='cash')cash+=gv(c.svc);
    if(cash>0)out.push({t:cdHHMM(c.time)||'00:00',amt:r2(cash),label:(c.clientName||'')+(c.tech?'（'+c.tech+'）':'')+(c.pay==='gc'?' 禮品卡補差額':(c.cp?' ClassPass加購':''))});
  });
  ((_D.products&&_D.products[mo])||[]).forEach(function(p){ var b=p.store?(p.store===store):(store==='mv'); if(b&&p.date===date&&p.pay==='cash'&&gv(p.amt)>0)out.push({t:'00:00',amt:r2(gv(p.amt)),label:'產品 '+(p.name||'')}); });
  (_D.gc_cards||[]).forEach(function(g){ if(g.store===store&&g.date===date&&g.pay==='cash')out.push({t:'00:00',amt:r2(g.amt||0),label:'禮品卡 '+(g.code||'')}); });
  (window._gcFbAll||[]).forEach(function(g){ if(g.store===store&&g.date===date&&g.payMethod==='cash')out.push({t:cdHHMM(g.time)||'00:00',amt:r2((g.amount||0)+gv(g.tip)),label:'禮品卡(iPad) '+(g.code||'')+(gv(g.tip)>0?'（含小費 $'+gv(g.tip).toFixed(2)+'）':'')}); });
  if(!clients.length&&day&&day.sqCash)out.push({t:'00:00',amt:r2(gv(day.sqCash))});
  return out;
}
function cdCompute(store,uptoDate,fromDate){
  var base=[], countDates={};
  cdData().forEach(function(e){ if(e.store===store&&e.type==='count'){ countDates[e.date]=1; base.push({date:e.date,t:cdEntryTime(e)||'23:59',amt:e.amt,id:e.id||0,kind:'count'}); } });
  Object.keys(_D.cdManual||{}).forEach(function(mo){
    var v=_D.cdManual[mo]&&_D.cdManual[mo][store]; if(v===undefined||v===null)return;
    var amt=(typeof v==='object')?v.amt:v;
    if(amt===null||amt===undefined||isNaN(parseFloat(amt)))return;
    // 「月初保險箱的錢」＝那個月 1 號一開始的金額（不管是哪天才輸入的）
    base.push({date:mo+'-01',t:'',amt:parseFloat(amt),id:0,kind:'manual'}); // t 空白＝排在 1 號所有事情之前
  });
  var key=function(x){return x.date+' '+x.t;};
  base.sort(function(a,b){return key(a)<key(b)?-1:key(a)>key(b)?1:a.id-b.id;});
  var usable=base.filter(function(b){return b.date<=uptoDate;});
  if(!usable.length)return null;
  var start=null;
  if(fromDate){
    // 起點：上個月（31 天內）最後一次「實際點鈔」→ 這樣月初第一次點鈔也能比對；
    // 沒有的話（例如之前很久沒點鈔、只有手動餘額）→ 用這個月第一次點鈔／手動餘額當起點，避免拿不完整的舊資料一路累加
    var winStart=cdAddDays(fromDate,-31);
    // 每個月分開算，不跟上個月混在一起：
    // 起點＝這個月的「月初保險箱的錢」；沒填的話＝這個月第一次點鈔；這個月都還沒有 → 沒辦法算（請填月初的錢）
    var monthManual=usable.find(function(b){return b.kind==='manual'&&b.date===fromDate;});
    start=monthManual||usable.find(function(b){return b.date>=fromDate;})||null;
    if(!start)return null;
  }
  if(!start)start=usable[0];
  var dup=cdDupInIds(store).ids;
  var flows=cdData().filter(function(e){return e.store===store&&(e.type==='out'||e.type==='expense'||(e.type==='in'&&!dup[e.id]));});
  var ev=[];
  for(var day=start.date;day<=uptoDate;day=cdAddDays(day,1)){
    cdSalesItems(store,day).forEach(function(x){ if(x.tip)return; ev.push({date:day,t:x.t,o:0,kind:'sale',amt:x.amt}); }); // 小費另外算，不進保險箱帳面
  }
  flows.forEach(function(f){ if(f.date<start.date||f.date>uptoDate)return; ev.push({date:f.date,t:cdEntryTime(f)||'12:00',o:1,kind:f.type,amt:f.amt,id:f.id||0}); });
  base.forEach(function(b){ if(b===start||b.date<start.date||b.date>uptoDate)return; ev.push({date:b.date,t:b.t,o:2,kind:'base',b:b,id:b.id}); });
  // 只算起點「之後」發生的事（同一天、時間比起點早的不算）
  ev=ev.filter(function(x){ var kx=key(x), ks=key(start); return kx>ks||(kx===ks&&x.o===2&&(x.id||0)>start.id); });
  ev.sort(function(a,b){ var ka=key(a),kb=key(b); if(ka!==kb)return ka<kb?-1:1; if(a.o!==b.o)return a.o-b.o; return (a.id||0)-(b.id||0); });
  var running=start.amt, since={sales:0,in:0,out:0,exp:0,tip:0,tipout:0}, results=[], lastBase=start, atFrom;
  ev.forEach(function(x){
    if(fromDate&&atFrom===undefined&&x.date>=fromDate)atFrom=r2(running); // 月初（fromDate 那天開始前）的帳面
    if(x.kind==='sale'){running+=x.amt;since.sales+=x.amt;}
    else if(x.kind==='tip'){running+=x.amt;since.tip+=x.amt;}
    else if(x.kind==='tipout'){running-=x.amt;since.tipout+=x.amt;}
    else if(x.kind==='in'){running+=x.amt;since.in+=x.amt;}
    else if(x.kind==='out'){running-=x.amt;since.out+=x.amt;}
    else if(x.kind==='expense'){running-=x.amt;since.exp+=x.amt;}
    else if(x.kind==='base'){
      var exp=r2(running);
      var ent=x.b.kind==='count'?cdData().find(function(e){return e.id===x.b.id;}):null;
      results.push({id:x.b.id,reason:(ent&&ent.reason)||'',date:x.b.date,kind:x.b.kind,counted:r2(x.b.amt),expected:exp,diff:r2(x.b.amt-exp),from:lastBase,since:{sales:r2(since.sales),in:r2(since.in),out:r2(since.out),exp:r2(since.exp)}});
      running=x.b.amt; lastBase=x.b; since={sales:0,in:0,out:0,exp:0,tip:0,tipout:0};
    }
  });
  if(atFrom===undefined)atFrom=r2(running);
  return {atFrom:atFrom,start:start,now:r2(running),last:lastBase,since:{sales:r2(since.sales),in:r2(since.in),out:r2(since.out),exp:r2(since.exp),tip:r2(since.tip),tipout:r2(since.tipout)},checks:results};
}

/* ---------- live data ---------- */
function ensureStore(id) {
  if (!data[id]) data[id] = {board:null,checks:{},subs:{},cash:{},live:false};
  if (!fs || data[id].live) return;
  data[id].live = true;
  fs.onSnapshot(refOf.board(id), snap => {
    connected = true;
    data[id].board = snap.exists() ? snap.data() : {};
    render();
  }, showDbError);
  if (!isLinked(id)) fs.onSnapshot(refOf.cash(id), snap => {
    data[id].cash = snap.exists() ? snap.data() : {};
    render();
  }, showDbError);
}
function watchChecks(s,d) {
  const box = data[s];
  if (box.subs[d]) return;
  box.subs[d] = fs.onSnapshot(refOf.checks(s,d), snap => {
    box.checks[d] = snap.exists() ? (snap.data().items||{}) : {};
    render();
  }, showDbError);
}
function watchDates() {
  stores().forEach(({id}) => ensureStore(id));
  if (!fs) return;
  stores().forEach(({id}) => {
    const box = data[id];
    watchChecks(id,today);
    if (viewDate <= today) watchChecks(id,viewDate);
    Object.keys(box.subs).forEach(d => {
      if (d !== today && d !== viewDate) { box.subs[d](); delete box.subs[d]; delete box.checks[d]; }
    });
  });
}
function startLive() {
  fs.onSnapshot(refOf.cfg(), snap => {
    storeCfg = snap.exists() ? (snap.data().stores||{}) : {};
    watchDates();
    render();
  }, showDbError);
  watchDates();
  // 主系統：員工和現金櫃都在主檔；每日記帳一個月一份，只讀看的那個月
  fs.onSnapshot(refOf.main(), snap => {
    try {
      if (!snap.exists()) { mainFailed = 'none'; render(); return; }
      const raw = snap.data();
      const main = raw._fmt === 2 ? JSON.parse(raw._json||'{}') : raw;
      mainIdx = raw._shards || {};
      const prev = _D || {};
      if (raw._fmt === 2) { main.mv = prev.mv||{}; main.sr = prev.sr||{}; }
      _D = main;
      mainFailed = '';
      const rawStaff = (main.staff && main.staff.length) ? main.staff : Object.keys(main.staffPay||{});
      const left = main.staffLeft||{}, mo = today.slice(0,7);
      staff = [...new Set(rawStaff.map(n => typeof n === 'string' ? n : (n&&n.name)||'').filter(n => n && n !== 'undefined' && !(left[n] && String(left[n]).slice(0,7) < mo)))].sort();
      applyGcPayOverrides();
      loadShards();
      render();
    } catch (e) { console.warn('main data',e); mainFailed = 'error'; render(); }
  }, e => { console.warn('main data',e); mainFailed = 'error'; render(); });
  fs.onSnapshot(fs.collection(db,'gift_certificates'), snap => {
    window._gcFbAll = snap.docs.map(d => ({id:d.id,...d.data()}))
      .filter(g => g.type==='gift_certificate' && g.store && g.issuedAt)
      .map(g => ({
        id:g.id, store:g.store, amount:g.amount||0,
        tip:Math.round((parseFloat(g.tip)||0)*100)/100,
        payMethod:g.payMethod||'',
        date:(function(v){var t=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(t)||t.indexOf('T')<0)return t.slice(0,10);var dd=new Date(t);return isNaN(dd.getTime())?t.slice(0,10):dd.toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});})(g.issuedAt),
        code:g.code||'', giftFor:g.giftFor||'',
        time:(function(v){var t=String(v||'');if(t.indexOf('T')<0)return '';var dd=new Date(t);return isNaN(dd.getTime())?'':dd.toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'});})(g.issuedAt)
      }));
    applyGcPayOverrides();
    render();
  }, e => console.warn('gift certificates',e));
  setTimeout(() => { if (!connected && !dbError) { dbError = '連不上資料庫，請檢查 WiFi 後重新整理。'; renderBanner(); } }, 10000);
}
async function loadShards() {
  if (!fs || !_D || !Object.keys(mainIdx).length) return;
  const mo = viewDate.slice(0,7);
  let changed = false;
  await Promise.all(Object.keys(LINKED).map(async s => {
    const id = `m_${s}_${mo}`;
    const h = mainIdx[id];
    if (!h) return;
    if (shardHash[id] === h && _D[s]?.[mo]) return;
    try {
      const sn = await fs.getDoc(fs.doc(db,'chic lash',id));
      if (sn.exists()) {
        if (!_D[s]) _D[s] = {};
        _D[s][mo] = JSON.parse(sn.data().v);
        shardHash[id] = h;
        changed = true;
      }
    } catch (e) { console.warn('shard',id,e); }
  }));
  if (changed) render();
}

  if (n) LS.set('sl.name',{name:n,date:today}); else LS.del('sl.name');
  setText($('who'), n || '選名字');
  $('who').classList.toggle('empty',!n);
}
let nameResolve = null;
function openNames() {
  const box = $('names');
  box.replaceChildren(...staff.map(n => {
    const b = document.createElement('button');
    b.textContent = n;
    b.classList.toggle('on', n === name);
    b.onclick = () => closeNames(n);
    return b;
  }));

function closeNames(n) {
  if (n) setName(n);
  if ($('nameDlg').open) $('nameDlg').close();
  if (nameResolve) { nameResolve(n||''); nameResolve = null; }
}
const needName = async () => name || await openNames();
$('who').onclick = () => openNames();
$('nameCancel').onclick = () => closeNames('');
$('nameDlg').addEventListener('cancel', e => { e.preventDefault(); closeNames(''); });
$('otherUse').onclick = () => { const v = $('otherName').value.trim(); if (v) closeNames(v); };
enterKey($('otherName'),() => $('otherUse').click());
function confirmIt(text) {

    $('confirmYes').onclick = () => { $('confirmDlg').close(); res(true); };

let toastTimer;
function toast(msg) {

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);

/* ---------- derived ---------- */
const board = s => data[s]?.board || {};
const templateOf = s => Object.entries(board(s).template||{})
  .map(([id,v]) => ({id,...v}))
  .sort((a,b) => (a.order||0)-(b.order||0) || a.id.localeCompare(b.id));
function dailyRows(s,d) {
  const checks = data[s]?.checks[d] || {};
  const tpl = templateOf(s).filter(t => d >= today || !t.created || t.created <= d);
  const ids = new Set(tpl.map(t => t.id));
  const removed = Object.entries(checks).filter(([id]) => !ids.has(id)).map(([id,c]) => ({id,text:c.text,order:1e15}));
  return [...tpl,...removed].map(t => ({...t,check:checks[t.id]||null}));
}
const allTasks = s => Object.entries(board(s).tasks||{})
  .map(([id,v]) => ({id,...v}))
  .sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)) || a.id.localeCompare(b.id));
function dayTasks(s,d) {
  return allTasks(s).filter(t => {
    const doneDay = t.done && t.doneAt ? ymd(new Date(t.doneAt)) : '';
    if (d === today) return t.due === today || (t.due < today && (!t.done || doneDay === today));
    if (d < today) return t.due === d || doneDay === d;
    return t.due === d;
  });
}
function countsFor(s,d) {
  if (isLinked(s)) return cdData().filter(e => e.store === s && e.type === 'count' && e.date === d)
    .slice().sort((a,b) => (a.time||'').localeCompare(b.time||''));
  return Object.entries(data[s]?.cash||{}).map(([k,v]) => ({...v,id:v.id||k}))
    .filter(e => e.date === d).sort((a,b) => (a.time||'').localeCompare(b.time||''));
}
function bookFor(s,d) { // 帳面應有；這個月沒有起點時回傳 null，還在讀取時回傳 undefined
  if (!isLinked(s) || !_D) return undefined;
  const mo = d.slice(0,7);
  if (!_D[s]?.[mo] && mainIdx[`m_${s}_${mo}`]) return undefined;
  try { return cdCompute(s,d,mo+'-01'); } catch (e) { console.warn(e); return undefined; }
}

/* ---------- date ---------- */
function markedDays() {
  const marked = new Set();
  stores().forEach(({id}) => allTasks(id).forEach(t => marked.add(t.due)));
  return marked;
}
function renderWeek() {
  const host = $('week');
  if (!host.children.length) for (let i = 0; i < 7; i++) {
    const b = document.createElement('button');
    b.className = 'day';
    b.innerHTML = '<span class="w"></span><span class="n"></span>';
    b.onclick = () => goDate(b.dataset.d);
    host.append(b);
  }
  const marked = markedDays();
  const v = parseDay(viewDate);

// 只把這一筆點鈔加進主系統的現金櫃紀錄；用交易寫入，同時有人存檔也不會蓋掉對方
async function pushCountToMain(rec) {
  await fs.runTransaction(db, async tx => {
    const ref = refOf.main();
    const sn = await tx.get(ref);
    if (!sn.exists()) throw new Error('main-missing');
    const raw = sn.data();
    if (raw._fmt !== 2 || typeof raw._json !== 'string') throw new Error('main-format');
    const main = JSON.parse(raw._json);
    if (!main || typeof main !== 'object' || !Array.isArray(main.staff)) throw new Error('main-format');
    if (!Array.isArray(main.cd)) main.cd = [];
    const mo = rec.date.slice(0,7);
    const prior = main.cd.filter(e => e.store===rec.store && e.type==='count' && e.date.slice(0,7)===mo);
    const last = prior.length ? prior[prior.length-1] : null;
    const entry = {...rec,
      id:Math.max(Date.now(),...main.cd.map(e => Number(e.id)||0).filter(n => n < 9e14).map(n => n+1)),
      change:last?r2(rec.amt-last.amt):null, lastAmt:last?last.amt:null, lastDate:last?last.date:''};
    main.cd.push(entry);
    main.cd.sort((a,b) => a.date<b.date?-1:a.date>b.date?1:(a.id||0)-(b.id||0));
    const ts = Math.max(Date.now(),(raw._savedAt||0)+1);
    main._savedAt = ts;
    const json = JSON.stringify(main);
    if (json.length > 950000) throw new Error('main-too-big');
    tx.set(ref,{...raw,_json:json,_savedAt:ts});
  });
}
async function saveCount(s) {
  const p = parts[s], el = p.el, d = viewDate;
  const hint = el.querySelector('.c-hint');
  const fail = t => { hint.classList.add('err'); setText(hint,t); };
  hint.classList.remove('err');
  if (!fs) return fail('還沒連上資料庫，這筆沒有存，數字還在。');
  const dr = p.draft, total = draftTotal(dr);
  if (total === 0) return fail('請先填入各面額數量');
  let time = nowHHMM();
  if (d !== today) {
    time = el.querySelector('.c-time').value;
    if (!time) { el.querySelector('.c-time').focus(); return fail('請填點鈔時間'); }
  }
  const who = await needName();
  if (!who) return;
  const details = CD_DENOMS.map(v => { const q = parseInt(dr.counts[v],10)||0; return q>0?`$${v}×${q}`:null; }).filter(Boolean).join(' / ');
  const rec = {date:d,time,store:s,type:'count',amt:total,note:`${details} / ${who}`,by:who};
  const reasonEl = el.querySelector('.c-reason');
  const reason = (reasonEl.hidden ? '' : dr.reason||'').trim();
  if (reason) rec.reason = reason;
  const btn = el.querySelector('.c-save');
  btn.disabled = true;
  setText(btn,'儲存中…');
  try {
    if (isLinked(s)) await pushCountToMain(rec);
    else { const id = uid(); await fs.setDoc(refOf.cash(s),{[id]:{...rec,id}},{merge:true}); }
    LS.del(p.draftKey);
    p.draftKey = '';
    toast(`已存入 ${money(total)}，${hhmmLabel(time)}`);
  } catch (e) {
    console.error(e);
    fail(e.message === 'main-too-big' ? '主系統資料已接近上限，這筆沒有存。'
      : String(e.message).startsWith('main-') ? '主系統資料格式不符，這筆沒有存。'
      : '儲存失敗，數字還在，請檢查 WiFi 再試一次。');
  }
  btn.disabled = false;
  setText(btn,'存入記錄');
  render();
}

/* ---------- clock & new day ---------- */
function tick() {
  const now = ymd(new Date());
  if (now !== today) {
    const wasToday = viewDate === today;
    today = now;
    if (wasToday) { viewDate = now; calMonth = now.slice(0,7); }
    setName('');
    watchDates();
    loadShards();
  }
  render();
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',() => { if (!document.hidden) tick(); });

setName(name);
watchDates();
